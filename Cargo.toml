[package]
name = "mulligan"
version = "0.7.1"
edition = "2021"
description = "A flexible retry library for Rust async operations with configurable backoff strategies and jitter."
license = "MIT"
homepage = "https://github.com/theelderbeever/mulligan"
repository = "https://github.com/theelderbeever/mulligan"
documentation = "https://docs.rs/mulligan"
rust-version = "1.85"

[features]
default = ["tokio"]        # Make tokio the default runtime
tokio = ["dep:tokio"]      # Depend on tokio when this feature is enabled
iter = ["dep:futures-core"] # Async retry-attempt interface
serde = ["dep:duration-string", "dep:serde"] # Deserialize retry policies

[dependencies]
tokio = { version = "1", optional = true, features = ["time"] }
rand = { version = "0.8" }
futures-core = { version = "0.3", optional = true }
duration-string = { version = "0.5", optional = true, features = ["serde"] }
serde = { version = "1", optional = true, features = ["derive"] }

[[example]]
name = "hello_world"
required-features = ["tokio"]

[[example]]
name = "reqwest"
required-features = ["tokio"]

[[example]]
name = "iter"
required-features = ["iter"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
futures = "0.3"
