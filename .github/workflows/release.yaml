name: Release

on:
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

jobs:
  release-pr:
    name: Prepare release PR
    if: github.ref_name == 'main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Prepare release PR
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to crates.io
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: write
      id-token: write
      pull-requests: read
    concurrency:
      group: crates-io-release
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Validate release branch
        shell: bash
        run: |
          set -euo pipefail

          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "mulligan") | .version')"
          expected_branch="release/${package_version}"

          if [[ "${GITHUB_REF_NAME}" != "${expected_branch}" ]]; then
            echo "Expected branch '${expected_branch}' for Cargo.toml version ${package_version}; got '${GITHUB_REF_NAME}'." >&2
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "${GITHUB_REF_NAME} must be cut from main without release-only commits." >&2
            exit 1
          fi
      - name: Run release checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features --locked
          cargo publish --dry-run --locked
      - name: Publish release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
