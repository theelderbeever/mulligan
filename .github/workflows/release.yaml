name: Release

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:
    inputs:
      publish_ref:
        description: >-
          Emergency recovery only: exact commit SHA to publish. Leave blank to
          prepare a release PR.
        required: false
        default: ''
        type: string

jobs:
  release-pr:
    name: Prepare release PR
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref_name == 'main' &&
      inputs.publish_ref == ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Prepare release PR
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to crates.io
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'release-plz-')) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref_name == 'main' &&
       inputs.publish_ref != '')
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: write
      id-token: write
      pull-requests: read
    concurrency:
      group: crates-io-release
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || inputs.publish_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Attach checkout to main
        shell: bash
        run: |
          set -euo pipefail

          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "The release commit must be on main." >&2
            exit 1
          fi

          git switch -C main
          git branch --set-upstream-to=origin/main main
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Run release checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features --locked
          cargo publish --dry-run --locked
      - name: Publish release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
